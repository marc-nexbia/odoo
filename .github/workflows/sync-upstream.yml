name: Sync Odoo 19.0

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-odoo-19
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'marc-nexbia/odoo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge official Odoo 19.0 updates without forcing changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${REPOSITORY}/merge-upstream" \
            -H "Accept: application/vnd.github+json" \
            -f branch='19.0' > sync-result.json
          {
            echo '## Odoo 19.0 synchronization'
            echo 'Upstream: https://github.com/odoo/odoo/tree/19.0'
            echo 'Target: https://github.com/marc-nexbia/odoo/tree/19.0'
            echo '```json'
            cat sync-result.json
            echo '```'
            echo 'No force push or reset is used. Conflicts fail the workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
